global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: "default-receiver"

receivers:
  - name: "default-receiver"
    # Fill in one (or more) of the blocks below and remove the ones you don't use.

    # --- Email ---
    # email_configs:
    #   - to: "you@example.com"
    #     from: "alertmanager@example.com"
    #     smarthost: "smtp.gmail.com:587"
    #     auth_username: "you@example.com"
    #     auth_identity: "you@example.com"
    #     auth_password: "app-password-here"
    #     send_resolved: true

    # --- Slack ---
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXXX/XXXX/XXXX"
    #     channel: "#alerts"
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
